name: 发布 H3 云端执行器

on:
  workflow_dispatch:
    inputs:
      version:
        description: 镜像版本号（例如 h3-worker-v0.1.0）
        required: true
        default: h3-worker-v0.1.0
  push:
    tags:
      - "h3-worker-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: h3-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并发布 linux-amd64 镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出固定源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成不可变标签
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository_owner }}/h3-production-worker
          tags: |
            type=sha,format=long
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag

      - name: 构建、自检并发布
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=h3-worker
          cache-to: type=gha,mode=max,scope=h3-worker
          provenance: true
          sbom: true

      - name: 记录可供应用锁定的摘要
        run: |
          echo '### H3 云端执行器' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/h3-production-worker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
